name: release

# A pushed v* tag builds and publishes the release. Run by hand, it builds all files and keeps
# them as workflow artifacts only (a dry run: nothing is published).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      network_ref:
        description: The anyplaynet/network commit to build the net service from (full SHA); empty takes the repository variable NETWORK_REF, then network.ref
        required: false

# Nothing writes by default; the one job that publishes asks for what it needs (see `publish`).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Build tools, installed from crates.io with --locked at exactly these versions. The release jobs
  # use no build cache: a poisoned cache could put code into a binary that no commit holds.
  CARGO_AUDITABLE_VERSION: 0.7.7
  RUST_AUDIT_INFO_VERSION: 0.5.4
  CARGO_CYCLONEDX_VERSION: 0.5.9
  # The installer compiler. Pinned, and checked against this SHA-256 before it runs.
  INNO_VERSION: 7.1.0
  INNO_SHA256: 0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f
  # The compiler of every release build, an exact version.
  RUST_TOOLCHAIN: 1.99.0
  # The cloud a release build names by default (the repository variable). Without it, players enter one.
  ANYPLAY_DEFAULT_CLOUD: ${{ vars.ANYPLAY_DEFAULT_CLOUD }}

jobs:
  # The licences of every third-party crate in the launcher and the net service it carries. Every
  # package ships the file, and the release carries it beside the portable exe.
  notices:
    runs-on: ubuntu-latest
    outputs:
      # The exact anyplaynet/network commit of the pin (network.ref), resolved once. Every job below builds
      # from it, so the files of one release cannot come from two revisions of main.
      network: ${{ steps.network.outputs.commit }}
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: launcher
      # The anyplaynet/network revision whose net service the launcher carries: the input of a run
      # by hand, else the repository variable NETWORK_REF, else the commit in network.ref. A full
      # commit SHA, never a branch: a release is built from a revision somebody chose. Bump
      # network.ref by a pull request.
      - id: network-pin
        name: Network revision
        shell: bash
        env:
          NETWORK_OVERRIDE: ${{ inputs.network_ref || vars.NETWORK_REF }}
        run: |
          ref=${NETWORK_OVERRIDE:-$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/launcher/network.ref")}
          [[ $ref =~ ^[0-9a-f]{40}$ ]] || { echo "the network revision must be one full commit SHA, got '$ref'" >&2; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: anyplaynet/network
          ref: ${{ steps.network-pin.outputs.ref }}
          path: network
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Network commit
        id: network
        run: echo "commit=$(git -C ../network rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Third-party licences
        run: tools/notices.sh dist/THIRD-PARTY-LICENSES.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-notices
          path: launcher/dist/THIRD-PARTY-LICENSES.txt
          if-no-files-found: error

  windows:
    needs: notices
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: launcher
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: launcher
      # The online crates come from anyplaynet/network, checked out beside the launcher.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: anyplaynet/network
          ref: ${{ needs.notices.outputs.network }}
          path: network

      - name: Version
        id: version
        run: |
          $toml = Get-Content Cargo.toml -Raw
          if ($toml -notmatch '(?ms)\[workspace\.package\].*?^version\s*=\s*"([^"]+)"') {
            throw 'no version in [workspace.package] of Cargo.toml'
          }
          $version = $Matches[1]
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "tag $env:GITHUB_REF_NAME does not match Cargo.toml version $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-pc-windows-msvc

      # cargo auditable puts the list of every crate into the binary (a `.dep-v0` section), so a
      # scanner can read what is inside an exe without the source. rust-audit-info reads it back.
      - name: Install cargo-auditable
        run: |
          cargo install --locked cargo-auditable --version $env:CARGO_AUDITABLE_VERSION
          cargo install --locked rust-audit-info --version $env:RUST_AUDIT_INFO_VERSION

      # The net service is built first, with the C runtime linked statically like the launcher,
      # and carried inside the launcher's exe.
      - name: Net service
        working-directory: network
        run: |
          $env:RUSTFLAGS = '-C target-feature=+crt-static'
          cargo auditable build --release --locked -p anyplay-net --target x86_64-pc-windows-msvc
          git rev-parse HEAD
          "ANYPLAY_NET_EMBED=$((Resolve-Path target/x86_64-pc-windows-msvc/release/anyplay-net.exe).Path)" >> $env:GITHUB_ENV

      # The share worker (share screen) is built the same way and carried inside the launcher
      # too: it encodes and decodes with the system's own H.264 and captures one window, so it
      # holds no codec of its own. The launcher gives it to the net service only where share
      # screen is switched on (Preferences::online_share_screen).
      - name: Share worker
        working-directory: network
        run: |
          $env:RUSTFLAGS = '-C target-feature=+crt-static'
          cargo auditable build --release --locked -p anyplay-share-worker --target x86_64-pc-windows-msvc
          "ANYPLAY_SHARE_EMBED=$((Resolve-Path target/x86_64-pc-windows-msvc/release/anyplay-share.exe).Path)" >> $env:GITHUB_ENV

      # .cargo/config.toml links the C runtime statically (crt-static).
      - name: Build
        run: cargo auditable build --release --locked --target x86_64-pc-windows-msvc

      # A build that lost the list (a changed profile, a wrapper) must fail here, not ship without.
      - name: The dependency lists are in the binaries
        run: |
          $binaries = @{
            'target/x86_64-pc-windows-msvc/release/anyplay-launcher.exe' = 'anyps5-launcher'
            '../network/target/x86_64-pc-windows-msvc/release/anyplay-net.exe' = 'anyplay-net'
            '../network/target/x86_64-pc-windows-msvc/release/anyplay-share.exe' = 'anyplay-share-worker'
          }
          foreach ($path in $binaries.Keys) {
            $json = rust-audit-info $path
            if ($LASTEXITCODE -ne 0) { throw "$path carries no dependency list" }
            $names = ($json | ConvertFrom-Json).packages.name
            if ($names -notcontains $binaries[$path]) { throw "$path does not list $($binaries[$path])" }
            "$path lists $($names.Count) packages"
          }

      - name: Portable exe
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = "dist/AnyPlay-Launcher-${{ steps.version.outputs.version }}-x64.exe"
          Copy-Item target/x86_64-pc-windows-msvc/release/anyplay-launcher.exe $exe
          # A statically linked runtime leaves no import of the Visual C++ runtime DLLs.
          $text = [Text.Encoding]::Latin1.GetString([IO.File]::ReadAllBytes($exe))
          foreach ($dll in 'VCRUNTIME140', 'MSVCP140') {
            if ($text -match $dll) { throw "$dll is still imported: the runtime is not static" }
          }
          # Launchers up to v0.1.3 (AnyPS5 Launcher) update only from this name: the same exe under it.
          Copy-Item $exe "dist/AnyPS5-Launcher-${{ steps.version.outputs.version }}-x64.exe"

      - name: Install Inno Setup
        run: |
          $setup = Join-Path $env:RUNNER_TEMP "innosetup-$env:INNO_VERSION-x64.exe"
          Invoke-WebRequest -UseBasicParsing -OutFile $setup `
            "https://github.com/jrsoftware/issrc/releases/download/is-$($env:INNO_VERSION.Replace('.', '_'))/innosetup-$env:INNO_VERSION-x64.exe"
          if ((Get-FileHash $setup -Algorithm SHA256).Hash -ne $env:INNO_SHA256) {
            throw 'the Inno Setup download does not match the pinned SHA-256'
          }
          $dir = Join-Path $env:RUNNER_TEMP 'inno'
          Start-Process -Wait -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$dir"
          if (-not (Test-Path "$dir/ISCC.exe")) { throw 'Inno Setup did not install' }
          "INNO_DIR=$dir" >> $env:GITHUB_ENV

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-notices
          path: launcher/notices

      - name: Installer
        run: |
          $exe = (Resolve-Path "dist/AnyPlay-Launcher-${{ steps.version.outputs.version }}-x64.exe").Path
          $notices = (Resolve-Path notices/THIRD-PARTY-LICENSES.txt).Path
          & "$env:INNO_DIR/ISCC.exe" "/DAppVersion=${{ steps.version.outputs.version }}" "/DExeSource=$exe" "/DNoticesSource=$notices" "/DOutputDir=$((Resolve-Path dist).Path)" tools/installer/anyplay-launcher.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-windows
          path: launcher/dist/*
          if-no-files-found: error

  # The Linux share worker, built apart: its PipeWire bindings (libspa 0.10) do not compile
  # against Ubuntu 22.04's PipeWire 0.3.48 headers. Built on 24.04 it still starts on 22.04 (glibc
  # 2.35): only two weak symbols of Rust's std (pidfd_spawnp, pidfd_getpid) name 2.39, and std
  # does without them. The linux job below carries it.
  linux-share-worker:
    needs: notices
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: anyplaynet/network
          ref: ${{ needs.notices.outputs.network }}
          path: network
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libpipewire-0.3-dev clang
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install cargo-auditable
        run: cargo install --locked cargo-auditable --version "$CARGO_AUDITABLE_VERSION"
      - name: Share worker
        working-directory: network
        run: cargo auditable build --release --locked -p anyplay-share-worker
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-share-worker
          path: network/target/release/anyplay-share
          if-no-files-found: error

  # Built on the oldest runner image still offered: a binary links against the glibc it is built
  # with, and an older one runs on more distributions.
  linux:
    needs: [notices, linux-share-worker]
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: launcher
      # The online crates come from anyplaynet/network, checked out beside the launcher.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: anyplaynet/network
          ref: ${{ needs.notices.outputs.network }}
          path: network

      - name: Version
        id: version
        run: |
          version=$(awk '/^\[workspace\.package\]/{p=1;next} p&&/^version[ ]*=/{gsub(/[" ]/,"",$0);sub(/^version=/,"",$0);print;exit}' Cargo.toml)
          if [ -z "$version" ]; then echo 'no version in [workspace.package] of Cargo.toml'; exit 1; fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install cargo-auditable
        run: |
          cargo install --locked cargo-auditable --version "$CARGO_AUDITABLE_VERSION"
          cargo install --locked rust-audit-info --version "$RUST_AUDIT_INFO_VERSION"

      - name: Net service
        working-directory: network
        run: |
          cargo auditable build --release --locked -p anyplay-net
          git rev-parse HEAD
          echo "ANYPLAY_NET_EMBED=$PWD/target/release/anyplay-net" >> "$GITHUB_ENV"

      # The share worker, carried like on Windows (built by linux-share-worker). On Linux it
      # captures through the desktop portal and PipeWire (it links the system's libpipewire-0.3)
      # and encodes with Cisco's OpenH264, which the launcher downloads only when the player turns
      # it on.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-share-worker
          path: share-worker
      - name: Share worker
        working-directory: share-worker
        run: |
          chmod +x anyplay-share
          echo "ANYPLAY_SHARE_EMBED=$PWD/anyplay-share" >> "$GITHUB_ENV"

      - name: Build
        run: cargo auditable build --release --locked

      - name: The dependency lists are in the binaries
        run: |
          check() { # binary, package it must list
            rust-audit-info "$1" | jq -e --arg p "$2" '[.packages[].name] | index($p) != null' > /dev/null
            echo "$1 lists $(rust-audit-info "$1" | jq '.packages | length') packages"
          }
          check target/release/anyplay-launcher anyps5-launcher
          check ../network/target/release/anyplay-net anyplay-net
          check ../share-worker/anyplay-share anyplay-share-worker

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-notices
          path: launcher/notices

      - name: Package
        run: tools/linux/package.sh "${{ steps.version.outputs.version }}" target/release/anyplay-launcher notices/THIRD-PARTY-LICENSES.txt dist

      - name: Check the AppImage
        run: |
          appimage="dist/AnyPlay-Launcher-${{ steps.version.outputs.version }}-x86_64.AppImage"
          file "$appimage"
          file "$appimage" | grep -q 'ELF 64-bit'
          # 64-bit ELF with the AppImage type 2 magic after the ELF header.
          test "$(dd if="$appimage" bs=1 skip=8 count=3 2>/dev/null | xxd -p)" = 414902
          # The highest glibc symbol version the binary needs.
          objdump -T target/release/anyplay-launcher | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-linux
          path: launcher/dist/*
          if-no-files-found: error

  # Apple silicon app, signed ad hoc. No Developer ID or notarization secret is used.
  macos:
    needs: notices
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    defaults:
      run:
        shell: bash
        working-directory: launcher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: launcher
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: anyplaynet/network
          ref: ${{ needs.notices.outputs.network }}
          path: network
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-darwin
      - name: Install dependency audit tools
        run: |
          cargo install --locked cargo-auditable --version "$CARGO_AUDITABLE_VERSION"
          cargo install --locked rust-audit-info --version "$RUST_AUDIT_INFO_VERSION"
      - name: Build
        run: cargo auditable build --release --locked --target aarch64-apple-darwin
      - name: Check the dependency list
        run: |
          rust-audit-info target/aarch64-apple-darwin/release/anyplay-launcher \
            | jq -e '[.packages[].name] | index("anyps5-launcher") != null'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-notices
          path: launcher/notices
      - name: Package and verify the distributed app
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tools/macos/package.sh "$version" target/aarch64-apple-darwin/release/anyplay-launcher notices/THIRD-PARTY-LICENSES.txt dist
          mkdir "$RUNNER_TEMP/unpacked"
          ditto -x -k "dist/AnyPlay-Launcher-$version-macos-arm64.zip" "$RUNNER_TEMP/unpacked"
          app="$RUNNER_TEMP/unpacked/AnyPlay Launcher.app"
          codesign --verify --strict "$app"
          test "$(lipo -archs "$app/Contents/MacOS/anyplay-launcher")" = arm64
          "$app/Contents/MacOS/anyplay-launcher" --gallery=home --screenshot="$RUNNER_TEMP/macos-home.png"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-macos
          path: launcher/dist/*.zip
          if-no-files-found: error

  # SBOMs, build info and one checksum file for everything, and the signing tool. No secret and no
  # write access: what signs and what publishes are the jobs `sign` and `release` below.
  publish:
    needs: [notices, windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      # The signing tool is built from this repository (docs/UPDATES.md); it needs the network
      # checkout beside it only because the workspace names it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: launcher
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: anyplaynet/network
          ref: ${{ needs.notices.outputs.network }}
          path: network
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      # The software bill of materials: CycloneDX 1.5, one file for the launcher and one for the
      # net service it carries, per platform, with the crates that go into the binary (no build
      # tools, no crates of other platforms). Made from the same Cargo.lock files the builds used.
      - name: SBOMs
        env:
          VERSION: ${{ needs.windows.outputs.version }}
        run: |
          set -euo pipefail
          cargo install --locked cargo-cyclonedx --version "$CARGO_CYCLONEDX_VERSION"
          # The time inside the file is the commit's, so the same commit gives the same file.
          SOURCE_DATE_EPOCH=$(git -C launcher log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          sbom() { # workspace, crate folder, file the tool writes, platform, rust target, name suffix
            (cd "$1" && cargo cyclonedx --manifest-path "crates/$2/Cargo.toml" --format json --spec-version 1.5 \
              --describe binaries --no-build-deps --target "$5")
            cp "$1/crates/$2/$3" "dist/AnyPlay-Launcher-$VERSION-$4$6.cdx.json"
          }
          sbom launcher anyps5-launcher anyplay-launcher_bin.cdx.json windows-x86_64 x86_64-pc-windows-msvc .sbom
          sbom network net anyplay-net_bin.cdx.json windows-x86_64 x86_64-pc-windows-msvc .net-service.sbom
          sbom network share-worker anyplay-share_bin.cdx.json windows-x86_64 x86_64-pc-windows-msvc .share-worker.sbom
          sbom launcher anyps5-launcher anyplay-launcher_bin.cdx.json linux-x86_64 x86_64-unknown-linux-gnu .sbom
          sbom network net anyplay-net_bin.cdx.json linux-x86_64 x86_64-unknown-linux-gnu .net-service.sbom
          sbom network share-worker anyplay-share_bin.cdx.json linux-x86_64 x86_64-unknown-linux-gnu .share-worker.sbom
          sbom launcher anyps5-launcher anyplay-launcher_bin.cdx.json macos-arm64 aarch64-apple-darwin .sbom
          for sbom in dist/*.cdx.json; do
            jq -e '.bomFormat == "CycloneDX" and (.components | length) > 0' "$sbom" > /dev/null
            echo "$sbom: $(jq '.components | length' "$sbom") components"
          done

      # What the attestation cannot say by itself: which network commit the net service came from.
      - name: Build info
        env:
          VERSION: ${{ needs.windows.outputs.version }}
          NETWORK_COMMIT: ${{ needs.notices.outputs.network }}
        run: |
          {
            echo "AnyPlay Launcher $VERSION"
            echo "launcher: https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
            echo "network:  https://github.com/anyplaynet/network/commit/$NETWORK_COMMIT (the net service inside the launcher)"
            echo "workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "dist/AnyPlay-Launcher-$VERSION-BUILD-INFO.txt"
          cat "dist/AnyPlay-Launcher-$VERSION-BUILD-INFO.txt"

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -b AnyPlay-Launcher-* AnyPS5-Launcher-* THIRD-PARTY-LICENSES.txt > SHA256SUMS.txt
          cat SHA256SUMS.txt
          # The old-name copy is what v0.1.2 and v0.1.3 update from: the same file, with its checksum.
          v=${{ needs.windows.outputs.version }}
          cmp "AnyPlay-Launcher-$v-x64.exe" "AnyPS5-Launcher-$v-x64.exe"
          grep -q " \*AnyPS5-Launcher-$v-x64\.exe$" SHA256SUMS.txt

      # Everything below that needs no secret is done here, in a job that never sees the signing
      # key: the tool that signs is built here, from this commit, and handed over as an artifact,
      # and the key list is checked with the parser the launcher itself uses.
      - name: The key list is readable
        working-directory: launcher
        run: cargo test --locked -p anyps5-core the_key_list

      - name: Build update-sign
        working-directory: launcher
        run: cargo build --release --locked -p anyplay-update-manifest --bin update-sign

      # A dry run (started by hand) signs with a key made here and thrown away, so the whole
      # manifest path is exercised without the real key. The result is not a release.
      - name: Dry run of the signing
        if: github.event_name != 'push'
        env:
          VERSION: ${{ needs.windows.outputs.version }}
        run: |
          set -euo pipefail
          tool="$PWD/launcher/target/release/update-sign"
          "$tool" keygen --secret-out "$RUNNER_TEMP/dry-run.key" --public-out "$RUNNER_TEMP/dry-run.line" --label dry-run
          "$tool" manifest --version "$VERSION" --days 30 \
            --supported-file launcher/MIN_SUPPORTED_VERSION \
            --exe "dist/AnyPlay-Launcher-$VERSION-x64.exe" \
            --appimage "dist/AnyPlay-Launcher-$VERSION-x86_64.AppImage" --out dist/latest.json
          "$tool" sign --manifest dist/latest.json --out dist/latest.json.sig --key-file "$RUNNER_TEMP/dry-run.key"
          "$tool" verify --manifest dist/latest.json --sig dist/latest.json.sig --keys "$RUNNER_TEMP/dry-run.line"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: anyplay-launcher-${{ needs.windows.outputs.version }}
          path: dist/*
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-sign
          path: launcher/target/release/update-sign
          if-no-files-found: error

  # The signed update manifest (docs/UPDATES.md): latest.json and latest.json.sig. The only job
  # that can read UPDATE_SIGNING_KEY, and only for a pushed tag: the secret lives in the GitHub
  # Environment "release-signing", which the operator restricts to the tags v* and to required
  # reviewers (docs/UPDATES.md). A run from a branch or by hand never reaches it. Within the job
  # only the step that signs has the secret in its environment, and the tool it runs was built
  # in the job before, not here.
  sign:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, publish]
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: read
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    env:
      VERSION: ${{ needs.windows.outputs.version }}
      # The oldest launcher that may update from this release; raise it when a release needs an
      # intermediate step.
      MINIMUM_VERSION: ${{ vars.UPDATE_MINIMUM_VERSION || '0.1.0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: launcher
          sparse-checkout: data
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: anyplay-launcher-${{ needs.windows.outputs.version }}
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: update-sign
          path: tool
      - name: Manifest
        run: |
          set -euo pipefail
          chmod +x tool/update-sign
          # One signed manifest for both platforms: the Windows exe and the Linux AppImage.
          # MIN_SUPPORTED_VERSION (a file of the tagged commit) retires launchers below it; an empty
          # one leaves the field out. A typo, or a version above this release, fails the release.
          tool/update-sign manifest --version "$VERSION" --minimum "$MINIMUM_VERSION" --days 30 \
            --supported-file launcher/MIN_SUPPORTED_VERSION \
            --exe "dist/AnyPlay-Launcher-$VERSION-x64.exe" \
            --appimage "dist/AnyPlay-Launcher-$VERSION-x86_64.AppImage" --out dist/latest.json
      # Without the secret there is no signature, which is right only while data/update-keys.txt
      # holds no key; once it holds one, launchers refuse a release without a manifest, so this
      # step fails the release instead of publishing one nobody can install. The list was parsed
      # by the launcher's own parser in `publish`, so the grep only has to tell "a key" from "none".
      - name: Sign
        id: sign
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          keys=launcher/data/update-keys.txt
          trusts_a_key() { grep -qE '^[[:space:]]*ed25519[[:space:]]' "$keys"; }
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            if trusts_a_key; then
              echo "::error::data/update-keys.txt trusts a key but the secret UPDATE_SIGNING_KEY is not set: launchers would refuse this release"
              exit 1
            fi
            echo "No UPDATE_SIGNING_KEY and no trusted key: no signed manifest, signing is not switched on."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            rm dist/latest.json
            exit 0
          fi
          tool/update-sign sign --manifest dist/latest.json --out dist/latest.json.sig --key-env UPDATE_SIGNING_KEY
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Verify against the trusted keys
        if: steps.sign.outputs.signed == 'true'
        run: |
          # The secret must belong to a key the launchers trust, or they would refuse the release.
          if grep -qE '^[[:space:]]*ed25519[[:space:]]' launcher/data/update-keys.txt; then
            tool/update-sign verify --manifest dist/latest.json --sig dist/latest.json.sig --keys launcher/data/update-keys.txt
          fi
      - if: steps.sign.outputs.signed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-manifest
          path: |
            dist/latest.json
            dist/latest.json.sig
          if-no-files-found: error

  # The release itself (tags only): provenance for every file, then the GitHub release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release and its files
      id-token: write # the OIDC token the attestation is signed with
      attestations: write # stores the attestation
    steps:
      # Only the release notes of this version: docs/releases/v<version>.md becomes the release text,
      # with GitHub's list of pull requests after it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: docs/releases
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: anyplay-launcher-${{ needs.windows.outputs.version }}
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.sign.outputs.signed == 'true'
        with:
          name: signed-manifest
          path: dist

      # Signed provenance for every file of the release: which workflow, from which commit, built
      # it. `gh attestation verify <file> --repo anyplaynet/launcher` checks it (docs/UPDATES.md).
      - name: Attest the release files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/AnyPlay-Launcher-${{ needs.windows.outputs.version }}-*
            dist/AnyPS5-Launcher-${{ needs.windows.outputs.version }}-x64.exe
            dist/THIRD-PARTY-LICENSES.txt
            dist/SHA256SUMS.txt
            ${{ needs.sign.outputs.signed == 'true' && 'dist/latest.json' || '' }}
            ${{ needs.sign.outputs.signed == 'true' && 'dist/latest.json.sig' || '' }}

      - id: gh-release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: AnyPlay Launcher ${{ needs.windows.outputs.version }}
          body_path: docs/releases/v${{ needs.windows.outputs.version }}.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/AnyPlay-Launcher-${{ needs.windows.outputs.version }}-x64.exe
            dist/AnyPlay-Launcher-${{ needs.windows.outputs.version }}-Setup.exe
            dist/AnyPlay-Launcher-${{ needs.windows.outputs.version }}-x86_64.AppImage
            dist/AnyPlay-Launcher-${{ needs.windows.outputs.version }}-linux-x86_64.tar.gz
            dist/AnyPlay-Launcher-${{ needs.windows.outputs.version }}-macos-arm64.zip
            dist/AnyPlay-Launcher-${{ needs.windows.outputs.version }}-macos-arm64.sbom.cdx.json
            dist/AnyPS5-Launcher-${{ needs.windows.outputs.version }}-x64.exe
            dist/AnyPlay-Launcher-${{ needs.windows.outputs.version }}-windows-x86_64.sbom.cdx.json
            dist/AnyPlay-Launcher-${{ needs.windows.outputs.version }}-windows-x86_64.net-service.sbom.cdx.json
            dist/AnyPlay-Launcher-${{ needs.windows.outputs.version }}-linux-x86_64.sbom.cdx.json
            dist/AnyPlay-Launcher-${{ needs.windows.outputs.version }}-linux-x86_64.net-service.sbom.cdx.json
            dist/AnyPlay-Launcher-${{ needs.windows.outputs.version }}-windows-x86_64.share-worker.sbom.cdx.json
            dist/AnyPlay-Launcher-${{ needs.windows.outputs.version }}-linux-x86_64.share-worker.sbom.cdx.json
            dist/AnyPlay-Launcher-${{ needs.windows.outputs.version }}-BUILD-INFO.txt
            dist/THIRD-PARTY-LICENSES.txt
            dist/SHA256SUMS.txt
            ${{ needs.sign.outputs.signed == 'true' && 'dist/latest.json' || '' }}
            ${{ needs.sign.outputs.signed == 'true' && 'dist/latest.json.sig' || '' }}

      # The release, announced on Discord: its title, text and link, through the webhook in the
      # repository secret DISCORD_RELEASES_WEBHOOK. Without the secret the step is skipped. A release
      # made with GITHUB_TOKEN starts no `release` workflow, so this runs here, after it is published,
      # and reads the published text back (the notes plus GitHub's list of pull requests).
      - id: discord
        name: Discord announcement
        env:
          GH_TOKEN: ${{ github.token }}
          WEBHOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "no DISCORD_RELEASES_WEBHOOK secret, nothing announced"; exit 0; fi
          echo "post=true" >> "$GITHUB_OUTPUT"
          eof=$(openssl rand -hex 16)
          { echo "body<<$eof"; gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body; echo "$eof"; } >> "$GITHUB_OUTPUT"
      # A failed announcement leaves the release as it is; the warning on the run says so.
      - if: steps.discord.outputs.post == 'true'
        continue-on-error: true
        uses: SethCohen/github-releases-to-discord@24d166886aee4646d448c8a389ff9e1ebcab3682 # v1.20.0
        with:
          webhook_url: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
          release_name: AnyPlay Launcher ${{ needs.windows.outputs.version }}
          release_body: ${{ steps.discord.outputs.body }}
          release_html_url: ${{ steps.gh-release.outputs.url }}
          username: AnyPlay Releases
          footer_timestamp: true
          remove_github_reference_links: true
          reduce_headings: true
