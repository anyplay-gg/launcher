[package]
name = "fake-phone"
description = "Test helper: stands in for the AnyPS5 Remote phone app (and for a game on the pad bridge). Never shipped."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyps5-core = { path = "../anyps5-core" }
tungstenite = "0.30"
mdns-sd = "0.21"
# The browser mode's TLS client: the same rustls on ring as the core, without aws-lc.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
tempfile.workspace = true
