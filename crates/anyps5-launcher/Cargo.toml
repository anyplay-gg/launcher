[package]
name = "anyps5-launcher"
description = "AnyPlay Launcher, the native launcher for AnyPS5 on Windows, Linux and macOS"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
build = "build.rs"

[[bin]]
name = "anyplay-launcher"
path = "src/main.rs"

[dependencies]
anyps5-core = { path = "../anyps5-core" }
eframe.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
gilrs.workspace = true
rodio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
sys-locale = "0.3"
rfd = "0.17.2"
raw-window-handle = "0.6"

time.workspace = true
naga = { version = "30", features = ["wgsl-in"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile.workspace = true
