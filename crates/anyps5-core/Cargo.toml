[package]
name = "anyps5-core"
description = "UI-free logic of the AnyPlay Launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyplay-control = { path = "../../../network/crates/control" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
notify.workspace = true
regex.workspace = true
sha2.workspace = true
# Cisco's OpenH264 comes as a bzip2 archive (MIT or Apache-2.0; its pure Rust libbz2 is
# under the bzip2-1.0.6 licence).
bzip2 = "0.6"
time.workspace = true
ureq.workspace = true
url = "2"
zip.workspace = true
anyplay-update-manifest = { path = "../update-manifest" }
flate2 = "1"
oozextract = "0.5"
tungstenite = "0.30"
mdns-sd = "0.21"
socket2 = "0.6"
getrandom = "0.4"
base64 = "0.22"
if-addrs = "0.15"
# LudusCtrl pairing and input signatures (RustCrypto, MIT or Apache-2.0): ECDH on P-256, HKDF and
# HMAC. The 0.14 line of p256 carries the constant-time fixes of crypto-bigint 0.7 (RUSTSEC-2026-0387
# is about 0.5); it goes with the 0.11 line of sha2, beside the workspace's 0.10.
p256 = { version = "0.14", default-features = false, features = ["ecdh"] }
hkdf = "0.13"
hmac = "0.13"
sha2-v11 = { package = "sha2", version = "0.11" }

[build-dependencies]
# build.rs parses data/update-keys.txt with the same parser the launcher uses at run time.
anyplay-update-manifest = { path = "../update-manifest" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
core-graphics = "0.23"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSRunningApplication", "libc"] }

[target.'cfg(windows)'.dependencies]
vigem-client = { version = "0.1", features = ["unstable_xtarget_notification"] }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile.workspace = true
tiny_http = "0.12"
ed25519-dalek = "3"
