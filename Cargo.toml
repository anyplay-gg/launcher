[workspace]
resolver = "3"
members = ["crates/anyps5-core", "crates/anyps5-launcher", "crates/atrac9", "crates/fake-relinker", "crates/fake-phone", "crates/update-manifest"]

[workspace.package]
version = "0.2.6"
edition = "2024"
license = "GPL-2.0-only"
repository = "https://github.com/anyplaynet/launcher"
rust-version = "1.95"

[workspace.dependencies]
eframe = "0.37"
egui = "0.37"
egui-wgpu = "0.37"
gilrs = "0.11"
gilrs-core = { version = "0.6", default-features = false }
rodio = "0.23"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
regex = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "macros", "local-offset"] }
ureq = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
windows = "0.62"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Dependencies (image decoding, egui, wgpu) run at a usable speed in debug builds.
[profile.dev.package."*"]
opt-level = 2
