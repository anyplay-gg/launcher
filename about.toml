# cargo about: the licences of the third-party crates in a release build, for
# THIRD-PARTY-LICENSES.txt (tools/notices.sh). Our own crates are not published and left out.
#
# The order is the preference when a crate offers a choice; licences compatible with the
# launcher's GPL-2.0-only come first. deny.toml decides what is allowed at all.
accepted = [
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "0BSD",
    "Unlicense",
    "MPL-2.0",
    "LGPL-2.1-or-later",
    "GPL-2.0-or-later",
    "GPL-2.0-only",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    # libbz2-rs-sys (unpacks Cisco's OpenH264 archive): the bzip2 licence, BSD-like.
    "bzip2-1.0.6",
    "Apache-2.0",
]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
workarounds = ["ring", "rustls"]

[private]
ignore = true
